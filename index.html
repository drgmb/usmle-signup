<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f7">
    <meta name="description" content="Crie sua conta no USMLE Study Tracker - Rastreie seu progresso nos estudos para o USMLE">
    <title>Criar Conta - USMLE Study Tracker</title>

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Auth SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .input-field {
            transition: all 0.2s ease;
            border: 2px solid #e5e7eb;
        }

        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            outline: none;
        }

        .input-field.error {
            border-color: #ef4444;
        }

        .input-field.success {
            border-color: #10b981;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.2s ease;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .requirement {
            transition: all 0.2s ease;
        }

        .requirement.met {
            color: #10b981;
        }

        .requirement.met svg {
            color: #10b981;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px -5px rgba(59, 130, 246, 0.4);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            transform: translateX(400px);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .toast.error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-checkmark {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease forwards;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .password-toggle {
            cursor: pointer;
            color: #9ca3af;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #6b7280;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div id="toast" class="toast"></div>

    <div class="card w-full max-w-md p-8 fade-in">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <div class="logo-icon">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                    </svg>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Criar Conta</h1>
            <p class="text-gray-500">USMLE Study Tracker</p>
        </div>

        <!-- Registration Form -->
        <form id="signupForm" class="space-y-5">
            <!-- Email Field -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="input-field w-full px-4 py-3 rounded-xl text-gray-900"
                    placeholder="seu@email.com"
                    required
                    autocomplete="email"
                >
                <p id="emailError" class="text-red-500 text-sm mt-1 hidden"></p>
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    Senha
                </label>
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input-field w-full px-4 py-3 rounded-xl text-gray-900 pr-12"
                        placeholder="Mínimo 8 caracteres"
                        required
                        autocomplete="new-password"
                    >
                    <button type="button" id="togglePassword" class="password-toggle absolute right-4 top-1/2 -translate-y-1/2">
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>

                <!-- Password Strength Bar -->
                <div class="mt-2 bg-gray-200 rounded-full overflow-hidden">
                    <div id="strengthBar" class="password-strength bg-gray-300" style="width: 0%"></div>
                </div>
                <p id="strengthText" class="text-xs text-gray-500 mt-1"></p>

                <!-- Password Requirements -->
                <div class="mt-3 space-y-1">
                    <div id="req-length" class="requirement flex items-center gap-2 text-xs text-gray-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        <span>Mínimo 8 caracteres</span>
                    </div>
                    <div id="req-uppercase" class="requirement flex items-center gap-2 text-xs text-gray-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        <span>Uma letra maiúscula</span>
                    </div>
                    <div id="req-lowercase" class="requirement flex items-center gap-2 text-xs text-gray-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        <span>Uma letra minúscula</span>
                    </div>
                    <div id="req-number" class="requirement flex items-center gap-2 text-xs text-gray-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        <span>Um número</span>
                    </div>
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
                    Confirmar Senha
                </label>
                <div class="relative">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        class="input-field w-full px-4 py-3 rounded-xl text-gray-900 pr-12"
                        placeholder="Digite a senha novamente"
                        required
                        autocomplete="new-password"
                    >
                    <button type="button" id="toggleConfirmPassword" class="password-toggle absolute right-4 top-1/2 -translate-y-1/2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <p id="confirmError" class="text-red-500 text-sm mt-1 hidden"></p>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                id="submitBtn"
                class="btn-primary w-full py-3 px-4 rounded-xl text-white font-semibold flex items-center justify-center gap-2"
                disabled
            >
                <span id="btnText">Criar Conta</span>
                <div id="btnSpinner" class="loading-spinner hidden"></div>
            </button>
        </form>

        <!-- Login Link -->
        <div class="mt-6 text-center">
            <p class="text-gray-500 text-sm">
                Já tem uma conta?
                <a href="https://drgmb.github.io/usmle-daily-study-tracker/" class="text-blue-600 font-medium hover:underline">
                    Fazer login
                </a>
            </p>
        </div>

        <!-- Success State (Hidden by default) -->
        <div id="successState" class="hidden text-center py-8">
            <div class="flex justify-center mb-6">
                <div class="success-checkmark">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Conta Criada!</h2>
            <p class="text-gray-500 mb-6">Verifique seu email para confirmar a conta.</p>
            <p id="redirectText" class="text-sm text-gray-400">Redirecionando em <span id="countdown">5</span> segundos...</p>
            <a
                href="https://drgmb.github.io/usmle-daily-study-tracker/"
                class="mt-4 inline-block text-blue-600 font-medium hover:underline"
            >
                Ir para o app agora
            </a>
        </div>
    </div>

    <script>
        // API Configuration
        const API_URL = 'https://wdkotckjvkctxvaewfyw.supabase.co';
        const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indka290Y2tqdmtjdHh2YWV3Znl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwODIxOTYsImV4cCI6MjA3OTY1ODE5Nn0.BQf0O1qmJSH0AHjwIDDSKTbU2LBaQtIpTkBEjfCzg7Y';
        const REDIRECT_URL = 'https://drgmb.github.io/usmle-daily-study-tracker/';

        // Initialize auth client
        const authClient = supabase.createClient(API_URL, API_KEY);

        // DOM Elements
        const form = document.getElementById('signupForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        const emailError = document.getElementById('emailError');
        const confirmError = document.getElementById('confirmError');
        const successState = document.getElementById('successState');
        const toast = document.getElementById('toast');

        // Password requirements elements
        const reqLength = document.getElementById('req-length');
        const reqUppercase = document.getElementById('req-uppercase');
        const reqLowercase = document.getElementById('req-lowercase');
        const reqNumber = document.getElementById('req-number');

        // Password visibility toggles
        document.getElementById('togglePassword').addEventListener('click', () => {
            togglePasswordVisibility(passwordInput, document.getElementById('eyeIcon'));
        });

        document.getElementById('toggleConfirmPassword').addEventListener('click', () => {
            togglePasswordVisibility(confirmPasswordInput);
        });

        function togglePasswordVisibility(input, icon) {
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
        }

        // Validate email format
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Check password requirements
        function checkPasswordRequirements(password) {
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /[0-9]/.test(password)
            };

            // Update requirement indicators
            updateRequirement(reqLength, requirements.length);
            updateRequirement(reqUppercase, requirements.uppercase);
            updateRequirement(reqLowercase, requirements.lowercase);
            updateRequirement(reqNumber, requirements.number);

            return requirements;
        }

        function updateRequirement(element, isMet) {
            if (isMet) {
                element.classList.add('met');
            } else {
                element.classList.remove('met');
            }
        }

        // Calculate password strength
        function calculatePasswordStrength(password) {
            const requirements = checkPasswordRequirements(password);
            const metCount = Object.values(requirements).filter(Boolean).length;

            let strength = 0;
            let text = '';
            let color = '';

            if (password.length === 0) {
                strength = 0;
                text = '';
                color = '#d1d5db';
            } else if (metCount === 1) {
                strength = 25;
                text = 'Muito fraca';
                color = '#ef4444';
            } else if (metCount === 2) {
                strength = 50;
                text = 'Fraca';
                color = '#f97316';
            } else if (metCount === 3) {
                strength = 75;
                text = 'Boa';
                color = '#eab308';
            } else if (metCount === 4) {
                strength = 100;
                text = 'Forte';
                color = '#10b981';
            }

            // Extra bonus for longer passwords
            if (password.length >= 12 && metCount === 4) {
                text = 'Muito forte';
            }

            strengthBar.style.width = strength + '%';
            strengthBar.style.backgroundColor = color;
            strengthText.textContent = text;
            strengthText.style.color = color;

            return metCount === 4;
        }

        // Validate form
        function validateForm() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            const isEmailValid = isValidEmail(email);
            const requirements = checkPasswordRequirements(password);
            const allRequirementsMet = Object.values(requirements).every(Boolean);
            const passwordsMatch = password === confirmPassword && password.length > 0;

            // Update email field state
            if (email.length > 0) {
                if (isEmailValid) {
                    emailInput.classList.remove('error');
                    emailInput.classList.add('success');
                    emailError.classList.add('hidden');
                } else {
                    emailInput.classList.remove('success');
                    emailInput.classList.add('error');
                    emailError.textContent = 'Email inválido';
                    emailError.classList.remove('hidden');
                }
            } else {
                emailInput.classList.remove('error', 'success');
                emailError.classList.add('hidden');
            }

            // Update confirm password field state
            if (confirmPassword.length > 0) {
                if (passwordsMatch) {
                    confirmPasswordInput.classList.remove('error');
                    confirmPasswordInput.classList.add('success');
                    confirmError.classList.add('hidden');
                } else {
                    confirmPasswordInput.classList.remove('success');
                    confirmPasswordInput.classList.add('error');
                    confirmError.textContent = 'As senhas não coincidem';
                    confirmError.classList.remove('hidden');
                }
            } else {
                confirmPasswordInput.classList.remove('error', 'success');
                confirmError.classList.add('hidden');
            }

            // Enable/disable submit button
            const isValid = isEmailValid && allRequirementsMet && passwordsMatch;
            submitBtn.disabled = !isValid;

            return isValid;
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }

        // Handle form submission
        async function handleSignup(e) {
            e.preventDefault();

            if (!validateForm()) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Show loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Criando conta...';
            btnSpinner.classList.remove('hidden');

            try {
                const { data, error } = await authClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        emailRedirectTo: REDIRECT_URL
                    }
                });

                if (error) {
                    throw error;
                }

                // Check if email confirmation is required
                if (data.user && data.user.identities && data.user.identities.length === 0) {
                    // User already exists
                    showToast('Este email já está cadastrado. Tente fazer login.', 'error');
                    resetButton();
                    return;
                }

                // Success! Show success state
                form.classList.add('hidden');
                document.querySelector('.text-center.mb-8').classList.add('hidden');
                document.querySelector('.mt-6.text-center').classList.add('hidden');
                successState.classList.remove('hidden');

                // Start countdown
                let seconds = 5;
                const countdownEl = document.getElementById('countdown');

                const interval = setInterval(() => {
                    seconds--;
                    countdownEl.textContent = seconds;

                    if (seconds <= 0) {
                        clearInterval(interval);
                        window.location.href = REDIRECT_URL;
                    }
                }, 1000);

            } catch (error) {
                console.error('Signup error:', error);

                let errorMessage = 'Erro ao criar conta. Tente novamente.';

                if (error.message) {
                    if (error.message.includes('already registered')) {
                        errorMessage = 'Este email já está cadastrado.';
                    } else if (error.message.includes('valid email')) {
                        errorMessage = 'Email inválido.';
                    } else if (error.message.includes('password')) {
                        errorMessage = 'Senha muito fraca.';
                    } else if (error.message.includes('rate limit')) {
                        errorMessage = 'Muitas tentativas. Aguarde um momento.';
                    }
                }

                showToast(errorMessage, 'error');
                resetButton();
            }
        }

        function resetButton() {
            submitBtn.disabled = false;
            btnText.textContent = 'Criar Conta';
            btnSpinner.classList.add('hidden');
            validateForm();
        }

        // Event listeners
        emailInput.addEventListener('input', validateForm);
        passwordInput.addEventListener('input', () => {
            calculatePasswordStrength(passwordInput.value);
            validateForm();
        });
        confirmPasswordInput.addEventListener('input', validateForm);
        form.addEventListener('submit', handleSignup);

        // Initial validation
        validateForm();
    </script>
</body>
</html>
